# Restart the backend after editing. Credentials belong in .env.
identification:
  guidance_cooldown_s: 30
  guidance_timeout_s: 25
  guidance_max_requests: 3
  recapture_max_attempts: 2
  max_books_per_frame: 80
  association_min_iou: 0.5
  association_max_hops: 16
  text_min_characters: 6
  text_edit_similarity: 0.9
  visual_min_crop_size: 8
  visual_max_dimension: 480
  visual_max_features: 500
  visual_ratio: 0.7
  visual_min_matches: 10
  visual_min_inlier_fraction: 0.65
  visual_min_support: 0.12
  visual_reprojection_px: 3.0
  visual_ransac_iterations: 500
  visual_ransac_confidence: 0.99
quality:
  max_dimension: 640
  dark_cutoff: 16
  bright_cutoff: 239
  brisque_model: library_claim/capture/assets/brisque_model_live.yml
  brisque_range: library_claim/capture/assets/brisque_range_live.yml
  method: opencv-quality-v1/brisque-live-4.10.0
  brisque_ranking_scale: 100
  max_extreme_fraction: 0.80
  min_sharpness: 20
tracking:
  max_dimension: 640
  capacity: 24
  reanchor_every: 10
  max_gap_s: 1.0
  min_reference_overlap: 0.2
  sift_features: 400
  flann_trees: 4
  flann_checks: 64
  descriptor_ratio: 0.7
  candidate_limit: 3
  min_matches: 12
  reprojection_threshold_px: 3.0
  ransac_iterations: 500
  ransac_confidence: 0.99
  min_inlier_fraction: 0.65
  min_support_area: 0.08
  min_projected_area_ratio: 0.15
  max_projected_area_ratio: 6.0
  forward_backward_error_px: 1.0
  max_corners: 250
  corner_quality: 0.01
  corner_min_distance_px: 8
  # Explicit OpenCV Lucas-Kanade defaults.
  lk_window: 21
  lk_max_level: 3
  lk_iterations: 30
  lk_epsilon: 0.01
  lk_min_eigen_threshold: 0.0001
selection:
  new_coverage_fraction: 0.15
  detail_gain: 1.25
  brisque_improvement: 5
  sharpness_gain: 1.25
  sharpness_floor: 1
capture:
  quality_interval_s: 1.0
  summary_log_interval_s: 5.0  # Console only; processing cadence is unchanged.
  remote_interval_s: 8.0
  frame_max_age_s: 12.0
  # Safety cap on spine reads per session (cost guard, not a functional limit).
  max_reads_per_session: 300
  # Only this subsection is sent to the browser.
  browser:
    frame_interval_ms: 200
    frame_width: 1024
    ideal_width: 1280
    ideal_height: 720
    jpeg_quality: 0.8
    # WebXR depth grid sent with each AR frame; the server accepts at most 160x120.
    depth_grid_width: 96
    depth_grid_height: 54
scheduler:
  concurrency: 1
  pending_limit: 8
  timeout_s: 30
inference:
  model: Qwen/Qwen3.8-27B
  vision_model: Qwen/Qwen3.8-27B
  # Tried in order when the model above fails; vision fallbacks must accept images.
  fallback_models: [google/gemma-4-31b-it]
  vision_fallback_models: [google/gemma-4-31b-it]
  max_tokens: 4096
  conversation_max_tokens: 512
  temperature: 0
  qwen_enable_thinking: false
  timeout_s: 60
  connect_timeout_s: 10
speech:
  stt_model: flux-general-en
  tts_model: aura-2-thalia-en
  tts_chunk_chars: 1800
  timeout_s: 30
  connect_timeout_s: 10
  close_timeout_s: 2
drex:
  model: drex-max-v1.1
  base_url: https://console.nace.ai
  client_name: library-claim/1
  timeout_s: 30
  connect_timeout_s: 10
  # Probability thresholds; the band between the two same-book bounds stays unresolved.
  book_visible_min: 0.5
  # A frame whose main issue is a capture defect is read only if its title looks legible.
  legible_min: 0.5
  capture_defects: [blur, glare, dark]
  # Measured on 24 labelled pairs (scripts/same_book_benchmark.py): Drex scores
  # same-book pairs 0.33-0.80 and different-book pairs 0.0006-0.077, so the band
  # sits in the gap between those two clusters. The former 0.8/0.2 discarded
  # almost every correct same-book answer and split one book into many.
  same_book_min: 0.25
  different_book_max: 0.15
  catalogue_min: 0.7
  # A store listing must be this likely to be a comparable replacement before its price is used.
  listing_match_min: 0.7
  target_min: 0.6
  quality_prompt_cooldown_s: 8
  same_prompt_cooldown_s: 20
  gate_failure_streak: 3
  # Frame checks slow to quiet_interval_s after this many consecutive checks see no book.
  quiet_streak: 3
  quiet_interval_s: 3.0
measurement:
  # Off: books are saved without dimensions and Depth Pro never loads.
  enabled: false
  # Fraction of each spine axis trimmed at both ends so depth is sampled on the book, not behind it.
  depth_inset: 0.15
  depth_window_px: 5
  # An endpoint whose depth differs from the box's inner median by more than this fraction
  # is treated as background and replaced by the inner median.
  depth_tolerance: 0.15
  # Sizes outside these ranges are refused as implausible for a book.
  height_range_cm: [5, 60]
  thickness_range_cm: [0.3, 15]
  depth_pro_model: apple/DepthPro-hf
  # Room geometry from the AR session's depth and poses.
  room_depth_range_m: [0.4, 12.0]
  room_min_frames: 4
  room_min_points: 2000
  room_yaw_bins: 24
  room_min_coverage: 0.75

pricing:
  # Locale is configuration: adding a country is a markets entry, not a code change.
  default_country: US
  condition_assumed: Used, good condition
  appraisal_threshold: 250.0
  appraisal_keywords: [signed, inscribed, first edition, limited edition, rare, antiquarian, folio society]
  # Markets tried for a converted figure when the local market has no price.
  convert_from: [US, GB]
  # Non-book contents are priced from store search results read through the web
  # listing source (NIMBLE_API_KEY); each listing is checked by Drex before it is used.
  item_providers: [amazon]
  fx_base_url: https://api.frankfurter.app
  timeout_s: 10
  connect_timeout_s: 5
  # A call is retried once; a source failing this many times in a row is skipped for the cooldown.
  retries: 1
  retry_backoff_s: 0.5
  retry_max_wait_s: 2.0
  breaker_failures: 3
  breaker_cooldown_s: 120
  nimble_timeout_s: 30
  max_listings: 8
  used_min_listings: 3
  workers: 6
  # Furniture and electronics cost more than books; their appraisal bar is this multiple.
  item_threshold_factor: 8
  # The packet also prices the first compare_books identified books in this market.
  compare_country: GB
  compare_books: 10
  markets:
    US:
      currency: USD
      providers: [google_books, amazon]
      used_providers: [abebooks]
      amazon_domain: www.amazon.com
      abebooks_domain: www.abebooks.com
    GB:
      currency: GBP
      providers: [google_books, amazon]
      used_providers: [abebooks]
      amazon_domain: www.amazon.co.uk
      abebooks_domain: www.abebooks.co.uk
items:
  # Off: frames are not inspected for non-book contents and the packet's item list stays empty.
  enabled: true
  max_items_per_frame: 24
  detection_interval_s: 12.0
  association_min_iou: 0.45
  max_appearance_candidates: 3
  print_statements: [print, poster, reproduction, reprint, not an original, it is a copy]
