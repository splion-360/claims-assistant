<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipeline Flow</title>
<style>
  :root {
    --bg: #0f1216; --panel: #171b21; --card: #1e232b; --line: #2c333d; --text: #e7ebf0; --muted: #8c96a3;
    --decision: #b388ff; --vision: #4fc3f7; --language: #4dd0e1; --local: #9aa5b1; --speech: #ffb74d; --web: #81c784; --depth: #f06292;
    --done: #4caf50; --error: #ef5350;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  /* The whole view fits the window: strips take their natural height, the log takes the rest. */
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.35 system-ui, -apple-system, Segoe UI, sans-serif;
         display: grid; grid-template-rows: auto auto minmax(0, 1fr); overflow: hidden; }
  header { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 15px; margin: 0 8px 0 0; }
  .stat { color: var(--muted); font-size: 12px; }
  .stat b { color: var(--text); font-variant-numeric: tabular-nums; }
  #status { margin-left: auto; font-size: 11px; padding: 2px 9px; border-radius: 999px; background: var(--card); }
  #status.live { color: var(--done); }
  #strips { padding: 8px 16px 0; display: grid; gap: 8px; }
  .strip { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px 8px; }
  .strip h2 { margin: 0 0 5px; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .row { display: flex; align-items: stretch; }
  .arrow { flex: 0 0 16px; display: flex; align-items: center; justify-content: center; color: var(--line); font-size: 14px; }
  .card { flex: 1 1 0; min-width: 0; background: var(--card); border: 2px solid var(--line); border-radius: 8px; padding: 5px 8px;
          display: flex; flex-direction: column; gap: 1px; transition: border-color .3s, box-shadow .3s, opacity .3s; }
  .card .who { font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
  .card .name { font-weight: 600; font-size: 12px; }
  .card .model { font: 10px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); }
  .card .detail { color: var(--muted); font-size: 11px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .model { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .name { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .meta { margin-top: auto; display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .card.decision { border-style: dashed; }
  .card.active { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); animation: pulse 1s ease-in-out infinite; }
  .card.done { border-color: var(--done); }
  .card.error { border-color: var(--error); }
  .card.error .detail { color: var(--error); }
  .card.off { opacity: .35; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 7px color-mix(in srgb, var(--accent) 10%, transparent); } }
  #logWrap { padding: 8px 16px 10px; min-height: 0; display: flex; }
  #log { flex: 1; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; overflow-y: auto;
         font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  #log div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #log .t { color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { .card.active { animation: none; } }
  @media (max-width: 900px) { body { overflow: auto; } .row { flex-wrap: wrap; gap: 6px; } .arrow { display: none; } .card { flex-basis: 140px; } }
</style>
</head>
<body>
<header>
  <h1>Library agent · live pipeline</h1>
  <span class="stat">Decision model calls <b id="drexCount">0</b></span>
  <span class="stat">Decision avg <b id="drexAvg">–</b></span>
  <span class="stat">Vision/language model calls <b id="modelCount">0</b></span>
  <span class="stat">Model fallbacks <b id="fallbackCount">0</b></span>
  <span id="status">Connecting…</span>
</header>
<main id="strips"></main>
<div id="logWrap"><div id="log" aria-live="polite"></div></div>
<script>
// Each step is labelled by its role; the model line shows whichever model actually answered.
const WHO = { decision: "Decision model", vision: "Vision model", language: "Language model", local: "Local",
              speech: "Speech model", web: "Catalogue", depth: "Depth model" };
const STRIPS = [
  { title: "1 · Capture — every camera frame", blocks: [
    ["camera", "local", "Browser camera"], ["tracking", "local", "Tracking (SIFT / optical flow)"],
    ["gate", "local", "Local gate (sharpness, exposure)"], ["d1", "decision", "Book visible? What's wrong?"],
    ["save", "local", "Evidence store"]] },
  { title: "2 · Identification — per frame with books", blocks: [
    ["spine_reading", "vision", "Spine reading"], ["d2", "decision", "Same book as one seen before?"],
    ["inventory", "local", "Inventory update"], ["depth", "depth", "Spine measurement"],
    ["openlibrary", "web", "Open Library search"], ["loc", "web", "Library of Congress (fallback)"],
    ["googlebooks", "web", "Google Books (with key)"],
    ["d3", "decision", "Which catalogue entry matches?"]] },
  { title: "3 · Voice — what the user says", blocks: [
    ["stt", "speech", "Speech to text"], ["d5", "decision", "What did the user mean?"],
    ["correction", "local", "Correction applied"], ["reply", "language", "Reply"], ["tts", "speech", "Speech out"]] },
  { title: "4 · Guidance — when the agent speaks up", blocks: [
    ["d6", "decision", "Speak now? Which prompt?"], ["guidance", "local", "Prompt chosen → Speech out"],
    ["announce", "local", "Book announced → Speech out"]] },
];
const cards = {}, timers = {};
const LABELS = { fallback: "Model fallback" };
let fallbackCount = 0;

// Build the strips once; each card is updated in place by stage events.
const root = document.getElementById("strips");
for (const strip of STRIPS) {
  const section = document.createElement("section");
  section.className = "strip";
  section.innerHTML = `<h2>${strip.title}</h2><div class="row"></div>`;
  const row = section.querySelector(".row");
  strip.blocks.forEach(([id, who, name], index) => {
    if (index) row.insertAdjacentHTML("beforeend", '<div class="arrow" aria-hidden="true">→</div>');
    const card = document.createElement("div");
    card.className = `card ${who === "decision" ? "decision" : ""}`;
    card.style.setProperty("--accent", `var(--${who})`);
    card.innerHTML = `<span class="who" style="color: var(--${who})">${WHO[who]}</span><span class="name"></span>
      <span class="model"></span><span class="detail">idle</span><span class="meta"><span class="ms"></span><span class="count">0×</span></span>`;
    card.querySelector(".name").textContent = name;
    card.title = `${WHO[who]} — ${name}`;
    card.dataset.count = "0";
    row.appendChild(card);
    cards[id] = card;
    LABELS[id] = who === "decision" ? `Decision model — ${name}` : name;
  });
  root.appendChild(section);
}

let drexCount = 0, drexTotalMs = 0, modelCount = 0;
function setState(card, state, holdMs) {
  card.classList.remove("active", "done", "error");
  if (state) card.classList.add(state);
  clearTimeout(timers[card.dataset.timer]);
  if (holdMs) {
    const key = Math.random().toString(36).slice(2);
    card.dataset.timer = key;
    timers[key] = setTimeout(() => card.classList.remove("done", "error"), holdMs);
  }
}

function apply(event, replay = false) {
  // A model fallback has no block of its own; count it and log which model took over.
  if (event.stage === "fallback") {
    document.getElementById("fallbackCount").textContent = ++fallbackCount;
    if (!replay) log(event);
    return;
  }
  const card = cards[event.stage];
  if (!card) return;
  const detail = card.querySelector(".detail");
  if (event.phase === "start") {
    setState(card, "active");
    detail.textContent = event.detail || "running…";
    return;
  }
  if (event.model) card.querySelector(".model").textContent = event.model;
  // A finished step keeps its last result visible after the highlight fades.
  if (event.detail) detail.textContent = event.detail;
  else if (event.phase === "done") detail.textContent = "done";
  if (event.ms != null) card.querySelector(".ms").textContent = `${event.ms} ms`;
  card.dataset.count = String(Number(card.dataset.count) + 1);
  card.querySelector(".count").textContent = `${card.dataset.count}×`;
  setState(card, event.phase === "error" ? "error" : event.phase === "done" ? "done" : null,
           replay ? 0 : event.phase === "error" ? 4000 : 1200);
  if (!replay) log(event);
  if (/^d\d$/.test(event.stage) && event.phase === "done") {
    drexCount += 1; drexTotalMs += event.ms || 0;
    document.getElementById("drexCount").textContent = drexCount;
    document.getElementById("drexAvg").textContent = `${Math.round(drexTotalMs / drexCount)} ms`;
  }
  if ((event.stage === "spine_reading" || event.stage === "reply") && event.phase === "done") {
    document.getElementById("modelCount").textContent = ++modelCount;
  }
}

function log(event) {
  // Camera and tracking fire several times a second; keep the log to meaningful steps.
  if (event.stage === "camera" || event.stage === "tracking") return;
  const box = document.getElementById("log");
  const line = document.createElement("div");
  const time = new Date(event.t * 1000).toLocaleTimeString();
  const ms = event.ms != null ? ` · ${event.ms} ms` : "";
  const model = event.model ? ` · ${event.model}` : "";
  line.innerHTML = `<span class="t">${time}</span> `;
  line.append(`${LABELS[event.stage]} — ${event.phase}${event.detail ? ": " + event.detail : ""}${ms}${model}`);
  box.prepend(line);
  while (box.childElementCount > 80) box.lastElementChild.remove();
}

function connect() {
  const status = document.getElementById("status");
  const source = new EventSource("/api/flow/events");
  source.addEventListener("setup", message => {
    const setup = JSON.parse(message.data);
    status.textContent = "Live"; status.className = "live";
    for (const [stage, model] of Object.entries(setup.models || {})) {
      if (cards[stage] && model) cards[stage].querySelector(".model").textContent = model;
    }
    if (!setup.measurement) {
      cards.depth.classList.add("off");
      cards.depth.querySelector(".detail").textContent = "off in config.yml";
    }
    setup.recent.forEach(event => apply(event, true));
  });
  source.onmessage = message => apply(JSON.parse(message.data));
  source.onerror = () => { status.textContent = "Reconnecting…"; status.className = ""; };
}
connect();
</script>
</body>
</html>
