<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipeline Flow</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --card: #1c2128; --line: #30363d; --edge: #484f58; --text: #e6edf3; --muted: #8b949e;
    --decision: #b388ff; --vision: #4fc3f7; --language: #4dd0e1; --local: #9aa5b1; --speech: #ffb74d; --web: #81c784; --depth: #f06292;
    --done: #3fb950; --error: #f85149; --running: #d29922;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  /* Two panels: the pipeline graph scales to fill the left, the event log scrolls on the right. */
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.35 system-ui, -apple-system, Segoe UI, sans-serif;
         display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 26%); gap: 12px; padding: 12px; overflow: hidden; }
  .panel { position: relative; min-height: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); overflow: hidden; }
  #stage { display: grid; grid-template-rows: minmax(0, 1fr) auto; }
  #graph { position: relative; min-height: 0; }
  #canvas { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #edges { position: absolute; left: 0; top: 0; overflow: visible; }
  .lane { position: absolute; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .divider { position: absolute; border-top: 1px dashed var(--line); }
  path.edge { fill: none; stroke: var(--edge); stroke-width: 2; transition: stroke .3s, opacity .3s; }
  path.edge.taken { stroke: var(--done); }
  path.edge.skipped { stroke-dasharray: 5 5; opacity: .45; }
  .pill { position: absolute; transform: translate(-50%, -50%); font-size: 11px; padding: 0 7px; border-radius: 6px; border: 1px solid var(--line);
          background: var(--card); color: var(--muted); white-space: nowrap; transition: all .3s; }
  .pill.taken { border-color: var(--done); color: var(--done); background: color-mix(in srgb, var(--done) 12%, var(--card)); }
  .pill.skipped { opacity: .5; }
  .node { position: absolute; transform: translate(-50%, -50%); background: var(--card); border: 1.5px solid var(--line);
          border-left: 3px solid var(--accent); border-radius: 7px; padding: 3px 8px 3px 26px; display: flex; flex-direction: column; justify-content: center;
          transition: border-color .3s, box-shadow .3s, opacity .3s; }
  .node .icon { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; border-radius: 50%;
                border: 1.5px solid var(--muted); display: grid; place-items: center; font-size: 9px; line-height: 1; color: #0d1117; }
  /* Names are written short enough to fit; nothing is truncated with an ellipsis. */
  .node .name { font-weight: 600; font-size: 12.5px; white-space: nowrap; }
  .node .model, .node .meta { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; }
  .node .model { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .node .meta { font-size: 11px; }
  /* Decisions are hexagons: an outer shape in the border colour and an inner one in the card colour. */
  .node.decision { border: 0; background: var(--state, var(--decision)); clip-path: polygon(10% 0, 90% 0, 100% 50%, 90% 100%, 10% 100%, 0 50%); padding: 0; }
  .node.decision .inner { position: absolute; inset: 2px; background: var(--card); clip-path: polygon(10% 0, 90% 0, 100% 50%, 90% 100%, 10% 100%, 0 50%);
                          padding: 3px 10px 3px 28px; display: flex; flex-direction: column; justify-content: center; }
  .node.decision .icon { left: 13px; }
  .node.terminal { border-style: dashed; border-left-width: 1.5px; }
  .node.running { border-color: var(--running); box-shadow: 0 0 0 3px color-mix(in srgb, var(--running) 25%, transparent); }
  .node.running .icon { border-color: var(--running); border-top-color: transparent; animation: spin .9s linear infinite; }
  .node.done .icon { background: var(--done); border-color: var(--done); }
  .node.done .icon::after { content: "✓"; }
  .node.done { border-color: color-mix(in srgb, var(--done) 70%, var(--line)); }
  .node.error .icon { background: var(--error); border-color: var(--error); }
  .node.error .icon::after { content: "!"; font-weight: 700; }
  .node.error { border-color: var(--error); }
  .node.error .meta { color: var(--error); }
  .node.skipped { opacity: .55; }
  .node.skipped .icon::after { content: "⊘"; color: var(--muted); font-size: 12px; }
  .node.off { opacity: .4; border-style: dashed; }
  .node.decision.running { --state: var(--running); }
  .node.decision.done { --state: var(--done); }
  .node.decision.error { --state: var(--error); }
  @keyframes spin { to { transform: translateY(-50%) rotate(360deg); } }
  #legend { display: flex; flex-wrap: wrap; gap: 4px 16px; padding: 8px 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
  #legend span { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--muted); display: inline-block; }
  .dot.ok { background: var(--done); border-color: var(--done); }
  .dot.run { border-color: var(--running); }
  .dot.err { background: var(--error); border-color: var(--error); }
  .dot.off { border-style: dashed; }
  .hex { width: 16px; height: 12px; background: var(--decision); clip-path: polygon(20% 0, 80% 0, 100% 50%, 80% 100%, 20% 100%, 0 50%); display: inline-block; }
  #side { display: grid; grid-template-rows: auto minmax(0, 1fr); }
  #side h2 { margin: 0; padding: 10px 14px; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .08em;
             border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }
  #status { text-transform: none; letter-spacing: 0; font-weight: 400; }
  #status.live { color: var(--done); }
  #log { overflow-y: auto; padding: 6px 12px; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
  #log div { padding: 3px 0; border-bottom: 1px solid color-mix(in srgb, var(--line) 50%, transparent); overflow-wrap: anywhere; }
  #log .t { color: var(--muted); margin-right: 6px; }
  #log .err { color: var(--error); }
  #log .out { color: var(--decision); }
  @media (prefers-reduced-motion: reduce) { .node.running .icon { animation: none; } }
  @media (max-width: 900px) { body { grid-template-columns: 1fr; grid-template-rows: 3fr 2fr; } }
</style>
</head>
<body>
<section class="panel" id="stage">
  <div id="graph"><div id="canvas"><svg id="edges"></svg></div></div>
  <div id="legend">
    <span><i class="dot ok"></i>Succeeded</span><span><i class="dot run"></i>Running</span><span><i class="dot err"></i>Failed</span>
    <span>⊘ Branch not taken</span><span><i class="dot off"></i>Off in config</span><span><i class="hex"></i>Drex decision</span>
  </div>
</section>
<aside class="panel" id="side">
  <h2>Events <span id="status">connecting…</span></h2>
  <div id="log" aria-live="polite"></div>
</aside>
<script>
// One left-to-right pipeline like a CI run graph: capture fans out to the book and object paths,
// each with its own Drex decisions, and both join at the finish. Voice and guidance run underneath.
const W = 1240, H = 540, X0 = 90, DX = 150, NODE_W = 112, NODE_H = 42, HEX_W = 128;
const ROWS = { top: 70, mid: 170, bottom: 270, low: 350, voice: 480 };
const LANES = [["Sweep", 14], ["Voice and guidance", 422]];
const x = col => X0 + col * DX;
// Nodes: [id, column, row, role, name]. Several pipeline stages report into one node (see ALIAS).
const NODES = [
  ["capture", 0, "mid", "local", "Capture"], ["d1", 1, "mid", "decision", "Book in view?"],
  ["spine_reading", 2, "top", "vision", "Read spines"], ["item_detection", 2, "mid", "vision", "Find objects"],
  ["d2", 3, "top", "decision", "Repeat book?"], ["same_object", 3, "mid", "decision", "Repeat item?"],
  ["depth", 3, "bottom", "depth", "Spine size"],
  ["d3", 4, "top", "decision", "In catalogue?"], ["listing_match", 4, "mid", "decision", "Store match?"],
  ["pricing", 5, "top", "web", "Book prices"], ["room", 5, "low", "depth", "Room size"],
  ["finish", 6, "mid", "local", "Finish"], ["summary", 7, "mid", "local", "Summary"],
  ["claim_packet", 7, "bottom", "local", "Packet"],
  ["stt", 0, "voice", "speech", "Speech in"], ["d5", 1, "voice", "decision", "Correction?"],
  ["reply", 2, "voice", "language", "Reply"], ["tts", 3, "voice", "speech", "Speech out"],
  ["d6", 5, "voice", "decision", "Speak now?"], ["guidance", 6, "voice", "local", "Prompt"],
];
// Stages folded into a node: the camera steps into Capture, the catalogue lookup into its decision,
// a saved correction into its decision, and spoken announcements into the prompt.
const ALIAS = { camera: "capture", tracking: "capture", gate: "capture", save: "capture", items: "item_detection",
                catalogue: "d3", correction: "d5", announce: "guidance" };
// Edges: [from, to, label, outcomes, route]. Outcome edges light when their decision answers one of
// them and are dashed when it answers anything else; "arc" lifts an edge over the node beside it.
const EDGES = [
  ["capture", "d1"], ["d1", "spine_reading", "books seen", ["admit"]], ["d1", "item_detection", "room contents"],
  ["spine_reading", "d2"], ["spine_reading", "depth"], ["d2", "d3", "repeat / new", ["same", "new", "unresolved"]],
  ["d3", "pricing", "found", ["matched"]], ["d3", "finish", "not found: review", ["review"], "arc"],
  ["item_detection", "same_object"], ["same_object", "listing_match", "repeat / new", ["same", "new"]],
  ["listing_match", "finish", "priced", ["priced"]],
  ["pricing", "finish"], ["depth", "finish"], ["room", "finish"],
  ["finish", "summary"], ["finish", "claim_packet"],
  ["stt", "d5"], ["d5", "reply", "reply", ["chat", "correction"]], ["reply", "tts"],
  ["d6", "guidance", "speak", ["speak"]],
];
// Full names for the log and tooltips.
// Long explanations shown on hover; the log uses the short LABELS below.
const TIPS = { fallback: "Model fallback", locale: "Market confirmed", capture: "Camera, tracking and local gate",
  d1: "Drex: is a readable book in this frame? Books go to spine reading; every clear frame goes to object detection",
  d2: "Drex: is this the same physical book as one already recorded, or a new copy?",
  d3: "Catalogue lookup (Google Books, Open Library), then Drex: which catalogue entry is this spine? No confident match goes to review",
  same_object: "Drex: is this the same physical object as one already recorded, or another one?",
  listing_match: "Drex: is this store listing the same product (or a comparable one) as the object? Only accepted listings are priced",
  d5: "Drex: is the user correcting the inventory (not mine, first edition, different title) or just talking?",
  d6: "Drex: should the agent speak up now, and with which capture prompt?", depth: "Spine size from phone depth (WebXR)", item_detection: "Object detection",
  claim_packet: "Claim packet download", guidance: "Spoken prompt or announcement", room: "Room size from phone depth",
  camera: "Camera", tracking: "Tracking", gate: "Local gate", save: "Frame saved", items: "Object list",
  catalogue: "Catalogue lookup", correction: "Correction saved", announce: "Book announced" };
const LABELS = { fallback: "Model fallback", locale: "Market confirmed", capture: "Capture", d1: "Drex: book in view?",
  d2: "Drex: repeat book?", d3: "Drex: in catalogue?", same_object: "Drex: repeat item?", listing_match: "Drex: store match?",
  d5: "Drex: correction?", d6: "Drex: speak now?", depth: "Spine size (WebXR)", room: "Room size (WebXR)",
  item_detection: "Find objects", items: "Object list", claim_packet: "Claim packet", guidance: "Prompt", camera: "Camera",
  tracking: "Tracking", gate: "Local gate", save: "Frame saved", catalogue: "Catalogue lookup", correction: "Correction saved",
  announce: "Book announced" };
const short = model => String(model || "").replace(/^[^/]+\//, "");
const cards = {}, edgeEls = [], timers = {};

function build() {
  const canvas = document.getElementById("canvas"), svg = document.getElementById("edges");
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  svg.setAttribute("width", W); svg.setAttribute("height", H);
  for (const [text, top] of LANES) {
    canvas.insertAdjacentHTML("beforeend", `<div class="lane" style="left:20px;top:${top}px">${text}</div>`);
    if (top > 30) canvas.insertAdjacentHTML("beforeend", `<div class="divider" style="left:20px;right:20px;top:${top - 10}px"></div>`);
  }
  for (const [id, col, row, who, name] of NODES) {
    const node = document.createElement("div");
    node.className = `node ${who === "decision" ? "decision" : ""} ${who === "terminal" ? "terminal" : ""}`;
    const width = who === "decision" ? HEX_W : NODE_W;
    Object.assign(node.style, { left: x(col) + "px", top: ROWS[row] + "px", width: width + "px", height: NODE_H + "px" });
    node.style.setProperty("--accent", who === "terminal" ? "var(--line)" : `var(--${who})`);
    const body = `<span class="icon"></span><span class="name"></span><span class="meta">idle</span>`;
    node.innerHTML = who === "decision" ? `<div class="inner">${body}</div>` : body;
    node.querySelector(".name").textContent = name;
    node.title = TIPS[id] || name;
    node.dataset.count = "0";
    canvas.appendChild(node);
    cards[id] = node;
    LABELS[id] = LABELS[id] || name;
    TIPS[id] = TIPS[id] || name;
  }
  const halfOf = id => (NODES.find(n => n[0] === id)[3] === "decision" ? HEX_W : NODE_W) / 2;
  for (const [from, to, label, outcomes, route] of EDGES) {
    const a = NODES.find(n => n[0] === from), b = NODES.find(n => n[0] === to);
    const x1 = x(a[1]) + halfOf(from), y1 = ROWS[a[2]], x2 = x(b[1]) - halfOf(to), y2 = ROWS[b[2]];
    let d, mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    if (route === "arc") {
      // Over the top of the node in between, like a skipped step in a CI graph.
      const lift = Math.min(y1, y2) - NODE_H / 2 - 22;
      d = `M${x1},${y1} C${x1 + 60},${lift} ${x2 - 60},${lift} ${x2},${y2}`;
      mx = (x1 + x2) / 2 + 40; my = lift + 4;
    } else if (y1 === y2) {
      d = `M${x1},${y1} L${x2},${y2}`;
      my = y1 - NODE_H / 2 - 12;
    } else {
      // Elbow with rounded corners, the shape a CI graph uses for fan-out and fan-in.
      // A join that skips columns bends just before its target, so it never crosses a node on the way.
      const skips = b[1] - a[1] > 1;
      const mid = skips ? x2 - 22 : x1 + Math.min(28, (x2 - x1) / 2);
      const r = Math.min(10, Math.abs(y2 - y1) / 2), dir = y2 > y1 ? 1 : -1;
      d = `M${x1},${y1} H${mid - r} Q${mid},${y1} ${mid},${y1 + dir * r} V${y2 - dir * r} Q${mid},${y2} ${mid + r},${y2} H${x2}`;
      mx = (mid + x2) / 2; my = y2 - NODE_H / 2 + 2;
    }
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", d); path.setAttribute("class", "edge");
    svg.appendChild(path);
    let pill = null;
    if (label) {
      pill = document.createElement("div");
      pill.className = "pill"; pill.textContent = label;
      pill.style.left = mx + "px"; pill.style.top = my + "px";
      canvas.appendChild(pill);
    }
    edgeEls.push({ from, to, outcomes: outcomes || null, path, pill });
  }
  fit();
}

function fit() {
  const graph = document.getElementById("graph"), canvas = document.getElementById("canvas");
  const scale = Math.min(graph.clientWidth / W, graph.clientHeight / H);
  canvas.style.transform = `scale(${scale})`;
  canvas.style.left = Math.max(0, (graph.clientWidth - W * scale) / 2) + "px";
  canvas.style.top = Math.max(0, (graph.clientHeight - H * scale) / 2) + "px";
}

function setState(id, state, holdMs) {
  const card = cards[id];
  if (!card) return;
  card.classList.remove("running", "done", "error", "skipped");
  if (state) card.classList.add(state);
  clearTimeout(timers[id]);
  if (holdMs) timers[id] = setTimeout(() => card.classList.remove("done", "error", "skipped"), holdMs);
}

function markEdges(predicate, cls, holdMs) {
  for (const edge of edgeEls.filter(predicate)) {
    for (const el of [edge.path, edge.pill].filter(Boolean)) {
      el.classList.remove("taken", "skipped");
      if (cls) el.classList.add(cls);
    }
    clearTimeout(edge.timer);
    if (holdMs) edge.timer = setTimeout(() => {
      for (const el of [edge.path, edge.pill].filter(Boolean)) el.classList.remove("taken", "skipped");
    }, holdMs);
  }
}

function apply(event, replay = false) {
  if (event.stage === "usage") return;
  // A decision's outcome lights the branch it chose and marks the others as not taken.
  if (event.phase === "outcome") {
    const hold = replay ? 0 : 2500, mine = e => e.from === event.stage && e.outcomes;
    markEdges(e => mine(e) && e.outcomes.includes(event.detail), "taken", hold);
    markEdges(e => mine(e) && !e.outcomes.includes(event.detail), "skipped", hold);
    for (const edge of edgeEls.filter(mine)) {
      const target = cards[edge.to], chosen = edge.outcomes.includes(event.detail);
      if (target && chosen && target.classList.contains("terminal")) setState(edge.to, "done", hold);
      else if (target && !chosen && !target.classList.contains("running")) setState(edge.to, "skipped", hold);
    }
    if (!replay) log(event);
    return;
  }
  const id = ALIAS[event.stage] || event.stage;
  const card = cards[id];
  if (!card) { if (!replay) log(event); return; }
  const meta = card.querySelector(".meta");
  if (event.phase === "start") {
    setState(id, "running");
    meta.textContent = "running";
    markEdges(e => e.to === id && !e.outcomes, "taken", replay ? 0 : 1500);
    return;
  }
  card.dataset.count = String(Number(card.dataset.count) + 1);
  // The node keeps timing and count; the full result goes to its tooltip and the log.
  const ms = event.ms != null ? (event.ms >= 1000 ? `${(event.ms / 1000).toFixed(1)} s` : `${event.ms} ms`) : "";
  meta.textContent = event.phase === "error" ? `failed · ${card.dataset.count}×` : [ms, `${card.dataset.count}×`].filter(Boolean).join(" · ");
  card.title = `${TIPS[id]}\nLast: ${LABELS[event.stage] || event.stage}: ${event.detail || event.phase}${event.model ? " · " + short(event.model) : ""}`;
  setState(id, event.phase === "error" ? "error" : event.phase === "done" ? "done" : null,
           replay ? 0 : event.phase === "error" ? 5000 : 1500);
  if (event.phase === "done") markEdges(e => e.to === id && !e.outcomes, "taken", replay ? 0 : 1500);
  if (!replay) log(event);
}

function log(event) {
  // Camera and tracking fire several times a second; keep the log to meaningful steps.
  if (["camera", "tracking", "gate"].includes(event.stage)) return;
  const box = document.getElementById("log");
  const line = document.createElement("div");
  if (event.phase === "error") line.className = "err";
  if (event.phase === "outcome") line.className = "out";
  const extra = [event.detail, event.ms != null ? `${event.ms} ms` : "", event.model ? short(event.model) : ""].filter(Boolean).join(" · ");
  line.innerHTML = `<span class="t">${new Date(event.t * 1000).toLocaleTimeString()}</span>`;
  line.append(`${LABELS[event.stage] || event.stage} ${event.phase}${extra ? ": " + extra : ""}`);
  box.prepend(line);
  while (box.childElementCount > 200) box.lastElementChild.remove();
}

function connect() {
  const status = document.getElementById("status");
  const source = new EventSource("/api/flow/events");
  source.addEventListener("setup", message => {
    const setup = JSON.parse(message.data);
    status.textContent = "live"; status.className = "live";
    for (const [stage, model] of Object.entries(setup.models || {})) {
      if (cards[stage] && model) cards[stage].title = `${TIPS[stage] || stage} (${short(model)})`;
    }
    for (const stage of setup.disabled || []) {
      if (!cards[stage]) continue;
      cards[stage].classList.add("off");
      cards[stage].querySelector(".meta").textContent = "off in config";
    }
    (setup.recent || []).forEach(event => apply(event, true));
  });
  source.onmessage = message => apply(JSON.parse(message.data));
  source.onerror = () => { status.textContent = "reconnecting…"; status.className = ""; };
}

build();
window.addEventListener("resize", fit);
connect();
</script>
</body>
</html>
