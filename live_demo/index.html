<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Claims Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&family=Patrick+Hand&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css?v=book-review-2" />
  </head>
  <body>
    <div class="desk">
      <header class="desk-bar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <h1>Claims Assistant</h1>
        </div>
        <div class="header-actions">
          <button id="openPacket" class="ghost-button" type="button">Browse books</button>
          <button id="inventoryButton" class="ghost-button" type="button">Show inventory</button>
        </div>
      </header>

      <main class="desk-layout">
        <aside class="side media-column" aria-label="Voice, text and camera">
          <section class="card call-card">
            <div class="card-head">
              <span id="callStatus" class="pill">Connecting</span>
            </div>

            <div id="cameraStage" class="camera-stage" hidden>
              <video id="cameraPreview" autoplay muted playsinline></video>
              <span class="camera-tag"><span class="rec-dot" aria-hidden="true"></span> Agent is watching</span>
            </div>

            <div class="controls">
              <button id="micButton" class="round-button" type="button" aria-label="Start or stop voice" disabled>
                <svg class="icon-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 10.5v1a7 7 0 0 0 14 0v-1"/><path d="M12 18.5V22"/><path d="M8.5 22h7"/></svg>
                <span class="round-label">Talk</span>
              </button>
              <button id="cameraButton" class="round-button" type="button" aria-label="Show the books on camera">
                <svg class="icon-camera" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.6A2 2 0 0 1 5 6.6h2.3l1.2-2h7l1.2 2H19a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.5"/></svg>
                <span class="round-label">Show camera</span>
              </button>
              <button id="phoneButton" class="round-button subtle" type="button" aria-label="Use a phone as the camera">
                <svg class="icon-phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M10.5 18.6h3"/></svg>
                <span class="round-label">Use phone</span>
              </button>
              <button id="phoneViewButton" class="round-button subtle" type="button" aria-label="Show or hide the phone camera view" aria-pressed="false">
                <svg class="icon-screen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="4" width="19" height="13" rx="2.5"/><path d="M8.5 20.5h7"/><path d="M12 17v3.5"/></svg>
                <span class="round-label">Phone view</span>
              </button>
              <button id="newIntakeButton" class="round-button subtle" type="button" aria-label="Start a new sweep">
                <span class="icon-new" aria-hidden="true"></span>
                <span class="round-label">New sweep</span>
              </button>
            </div>
            <figure id="phoneView" class="phone-view" hidden>
              <img id="phoneFrame" alt="What the paired phone is seeing">
              <figcaption>Phone camera</figcaption>
            </figure>
            <div id="pairingCode" class="pairing-code" hidden>
              <button id="closePairing" class="pairing-close" type="button" aria-label="Hide the pairing code">&times;</button>
              <strong id="pairingDigits"></strong>
            </div>
          </section>
          <section class="card team-card">
            <div class="card-head">
              <span class="card-kicker">Sweep activity</span>
              <span class="card-hint">Working in the background while you type</span>
            </div>
            <ul id="teamFeed" class="team-feed" tabindex="0" aria-label="Sweep activity activity"></ul>
          </section>
        </aside>

        <section class="notebook-wrap" aria-label="Field notebook" tabindex="0">
          <div class="notebook">
            <div class="holes" aria-hidden="true"><span></span><span></span><span></span></div>
            <div class="page-head">
              <span id="pageDate"></span>

            </div>
            <div id="notes" class="notes"></div>
            <button id="openBooks" class="ghost-button" type="button">Books · 0 identified · 0 need review</button>
            <div id="pinboard" class="pinboard"></div>
            <div id="stamp" class="stamp" hidden></div>
            <div id="pen" class="pen" hidden><span class="pen-nib" aria-hidden="true"></span> writing</div>
          </div>
        </section>
        <aside class="side conversation-column" aria-label="Transcript and claim checklist">
          <section class="card transcript-card">
            <div class="card-head">
              <span class="card-kicker">Transcript</span>
            </div>
            <div id="transcript" class="transcript" aria-live="polite" tabindex="0" role="region" aria-label="Conversation transcript"></div>

            <form id="textForm" class="text-entry">
              <input
                id="textInput"
                type="text"
                autocomplete="off"
                placeholder="Ask a question or correct a reading..."
                aria-label="Describe what you can see"
              />
              <button type="submit">Send</button>
            </form>
          </section>

          <section class="card needed-card">
            <div class="card-head">
              <span class="card-kicker">Still needed</span>
              <span id="readiness" class="pill neutral">0% collected</span>
            </div>
            <ul id="neededList" class="needed-list" tabindex="0" aria-label="Information still needed"></ul>
          </section>

        </aside>
      </main>
    </div>

    <dialog id="booksDialog" class="books-drawer" aria-labelledby="booksTitle">
      <div class="dialog-header"><h2 id="booksTitle">Your library</h2><button id="closeBooks" type="button">Back to sweep</button></div>
      <p>Browse what the camera saw. Compare possible matches before combining them.</p>
      <button id="downloadPacket" class="library-download" type="button">Download claim packet</button>
      <div class="book-tabs" aria-label="Book views"><button id="reviewTab" type="button" aria-pressed="true">Needs review</button><button id="identifiedTab" type="button" aria-pressed="false">Identified</button></div>
      <p id="bookActionStatus" role="status"></p>
      <div class="library-layout"><section id="bookInventory" aria-live="polite"></section>
      <section id="bookDetail" aria-label="Selected book"></section></div>
    </dialog>
    <canvas id="frameCanvas" hidden></canvas>
    <script src="./ar.js"></script>
    <script src="./voice.js?v=1"></script>
    <script src="./app.js?v=book-review-2"></script>
  </body>
</html>
