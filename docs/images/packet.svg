<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 360" width="1120" height="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>What a claim packet holds: sweep, room, books, items, totals and the review queue</title>
  <rect width="1120" height="360" fill="#FAF7F0"/>

  <text x="40" y="44" fill="#23201B" font-size="19" font-weight="600">claim_packet.json</text>

  <!-- Top row -->
  <rect x="40" y="68" width="248" height="112" rx="14" fill="#FFFFFF" stroke="#E0DBD0" stroke-width="2"/>
  <text x="164" y="100" text-anchor="middle" fill="#23201B" font-size="18" font-weight="600">sweep</text>
  <text x="164" y="124" text-anchor="middle" fill="#6F6A61" font-size="15">id · device · duration</text>
  <text x="164" y="146" text-anchor="middle" fill="#6F6A61" font-size="15">country · currency</text>

  <rect x="310" y="68" width="248" height="112" rx="14" fill="#FFFFFF" stroke="#E0DBD0" stroke-width="2"/>
  <text x="434" y="100" text-anchor="middle" fill="#23201B" font-size="18" font-weight="600">room</text>
  <text x="434" y="124" text-anchor="middle" fill="#6F6A61" font-size="15">floor · wall · shelved wall</text>
  <text x="434" y="146" text-anchor="middle" fill="#6F6A61" font-size="15">m² and ft² · scale method</text>

  <rect x="580" y="68" width="248" height="112" rx="14" fill="#FFFFFF" stroke="#E0DBD0" stroke-width="2"/>
  <text x="704" y="100" text-anchor="middle" fill="#23201B" font-size="18" font-weight="600">books[ ]</text>
  <text x="704" y="124" text-anchor="middle" fill="#6F6A61" font-size="15">title · ISBN · spine cm</text>
  <text x="704" y="146" text-anchor="middle" fill="#6F6A61" font-size="15">replacement · used value</text>

  <rect x="850" y="68" width="230" height="112" rx="14" fill="#FFFFFF" stroke="#E0DBD0" stroke-width="2"/>
  <text x="965" y="100" text-anchor="middle" fill="#23201B" font-size="18" font-weight="600">items[ ]</text>
  <text x="965" y="124" text-anchor="middle" fill="#6F6A61" font-size="15">category · brand</text>
  <text x="965" y="146" text-anchor="middle" fill="#6F6A61" font-size="15">priced | range | appraisal</text>

  <!-- Bottom row -->
  <rect x="310" y="214" width="248" height="96" rx="14" fill="#2F5D3A"/>
  <text x="434" y="248" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="600">totals</text>
  <text x="434" y="272" text-anchor="middle" fill="#CFE4D6" font-size="15">summed in code from the lines</text>
  <text x="434" y="292" text-anchor="middle" fill="#9DC4A9" font-size="14" font-style="italic">no model writes a number here</text>

  <rect x="580" y="214" width="500" height="96" rx="14" fill="#F6E5C8"/>
  <text x="830" y="248" text-anchor="middle" fill="#7A5312" font-size="18" font-weight="600">review_queue</text>
  <text x="830" y="272" text-anchor="middle" fill="#8A6424" font-size="15">every line the sweep is not confident in, with the reason</text>
  <text x="830" y="292" text-anchor="middle" fill="#9A7434" font-size="14" font-style="italic">unreadable spine · no price source · depth sampled past the book</text>

  <!-- Evidence -->
  <rect x="40" y="214" width="248" height="96" rx="14" fill="#23201B"/>
  <text x="164" y="248" text-anchor="middle" fill="#EDE8DC" font-size="18" font-weight="600">frames/</text>
  <text x="164" y="272" text-anchor="middle" fill="#A8A295" font-size="15">every frame the packet cites</text>
  <text x="164" y="292" text-anchor="middle" fill="#A8A295" font-size="14" font-style="italic">so each frame_ref resolves</text>
</svg>
