<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A Drex probability becomes a new copy, an unresolved line, or a merge</title>
  <rect width="1000" height="260" fill="#FAF7F0"/>

  <text x="40" y="44" fill="#23201B" font-size="19" font-weight="600">Drex returns a probability, so the thresholds are configuration</text>

  <!-- The three zones -->
  <rect x="40" y="74" width="300" height="72" rx="12" fill="#2F5D3A"/>
  <rect x="348" y="74" width="224" height="72" rx="12" fill="#F6E5C8"/>
  <rect x="580" y="74" width="380" height="72" rx="12" fill="#2F5D3A"/>

  <text x="190" y="107" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="600">A different book</text>
  <text x="190" y="130" text-anchor="middle" fill="#CFE4D6" font-size="15">recorded as a new copy</text>

  <text x="460" y="107" text-anchor="middle" fill="#7A5312" font-size="18" font-weight="600">Unresolved</text>
  <text x="460" y="130" text-anchor="middle" fill="#8A6424" font-size="15">sent to the review queue</text>

  <text x="770" y="107" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="600">The same book</text>
  <text x="770" y="130" text-anchor="middle" fill="#CFE4D6" font-size="15">merged into the record it matches</text>

  <!-- Scale -->
  <line x1="40" y1="176" x2="960" y2="176" stroke="#D8D1C2" stroke-width="2"/>
  <line x1="344" y1="166" x2="344" y2="186" stroke="#8E887C" stroke-width="2"/>
  <line x1="576" y1="166" x2="576" y2="186" stroke="#8E887C" stroke-width="2"/>

  <text x="40" y="206" fill="#6F6A61" font-size="15">0</text>
  <text x="344" y="206" text-anchor="middle" fill="#23201B" font-size="15" font-weight="600">different_book_max</text>
  <text x="576" y="206" text-anchor="middle" fill="#23201B" font-size="15" font-weight="600">same_book_min</text>
  <text x="960" y="206" text-anchor="end" fill="#6F6A61" font-size="15">1</text>

  <text x="40" y="240" fill="#8E887C" font-size="15" font-style="italic">Nothing in the middle band is forced into an answer. The same rule decides whether two sightings are the same object.</text>
</svg>
