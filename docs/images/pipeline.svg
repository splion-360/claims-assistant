<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 652" width="1280" height="652" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Claims Assistant pipeline: Drex gates every frame before the vision model sees it</title>
  <rect width="1280" height="652" fill="#FAF7F0"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8E887C"/>
    </marker>
    <marker id="arrow-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#C3BBAC"/>
    </marker>
  </defs>

  <!-- Capture devices -->
  <rect x="40" y="56" width="232" height="96" rx="14" fill="#23201B"/>
  <text x="156" y="92" text-anchor="middle" fill="#EDE8DC" font-size="20" font-weight="600">Phone</text>
  <text x="156" y="118" text-anchor="middle" fill="#A8A295" font-size="15">camera · depth grid</text>
  <text x="156" y="138" text-anchor="middle" fill="#A8A295" font-size="15">· camera pose</text>

  <rect x="40" y="206" width="232" height="96" rx="14" fill="#23201B"/>
  <text x="156" y="242" text-anchor="middle" fill="#EDE8DC" font-size="20" font-weight="600">Laptop console</text>
  <text x="156" y="268" text-anchor="middle" fill="#A8A295" font-size="15">voice · notepad</text>
  <text x="156" y="288" text-anchor="middle" fill="#A8A295" font-size="15">· inventory · packet</text>

  <!-- Local gate -->
  <rect x="368" y="76" width="196" height="96" rx="14" fill="#FFFFFF" stroke="#E0DBD0" stroke-width="2"/>
  <text x="466" y="112" text-anchor="middle" fill="#23201B" font-size="19" font-weight="600">Local gate</text>
  <text x="466" y="136" text-anchor="middle" fill="#6F6A61" font-size="15">sharpness · exposure</text>
  <text x="466" y="156" text-anchor="middle" fill="#8E887C" font-size="14" font-style="italic">free, instant</text>

  <!-- Drex admission -->
  <rect x="640" y="76" width="196" height="96" rx="14" fill="#2F5D3A"/>
  <text x="738" y="106" text-anchor="middle" fill="#FFFFFF" font-size="19" font-weight="600">Drex</text>
  <text x="738" y="130" text-anchor="middle" fill="#CFE4D6" font-size="15">book visible?</text>
  <text x="738" y="150" text-anchor="middle" fill="#CFE4D6" font-size="15">spine legible?</text>

  <!-- Vision model -->
  <rect x="912" y="76" width="212" height="96" rx="14" fill="#FFFFFF" stroke="#E0DBD0" stroke-width="2"/>
  <text x="1018" y="112" text-anchor="middle" fill="#23201B" font-size="19" font-weight="600">Vision model</text>
  <text x="1018" y="136" text-anchor="middle" fill="#6F6A61" font-size="15">spine text only</text>
  <text x="1018" y="156" text-anchor="middle" fill="#8E887C" font-size="14" font-style="italic">makes no decisions</text>

  <!-- Refused -->
  <rect x="640" y="238" width="196" height="64" rx="14" fill="#F3F0E8" stroke="#D8D1C2" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="738" y="266" text-anchor="middle" fill="#6F6A61" font-size="17" font-weight="600">Refused</text>
  <text x="738" y="288" text-anchor="middle" fill="#8E887C" font-size="14">no frontier call made</text>

  <!-- Drex decisions row -->
  <rect x="640" y="364" width="484" height="112" rx="14" fill="#2F5D3A"/>
  <text x="882" y="396" text-anchor="middle" fill="#FFFFFF" font-size="19" font-weight="600">Drex decides the rest</text>
  <text x="882" y="422" text-anchor="middle" fill="#CFE4D6" font-size="15">same book? · same object?</text>
  <text x="882" y="442" text-anchor="middle" fill="#CFE4D6" font-size="15">which catalogue work? · what the agent says</text>
  <text x="882" y="464" text-anchor="middle" fill="#9DC4A9" font-size="14" font-style="italic">probabilities, not labels</text>

  <!-- Measurement -->
  <rect x="368" y="364" width="196" height="112" rx="14" fill="#FFFFFF" stroke="#E0DBD0" stroke-width="2"/>
  <text x="466" y="400" text-anchor="middle" fill="#23201B" font-size="19" font-weight="600">Depth → cm</text>
  <text x="466" y="424" text-anchor="middle" fill="#6F6A61" font-size="15">spine sizes</text>
  <text x="466" y="444" text-anchor="middle" fill="#6F6A61" font-size="15">object sizes</text>
  <text x="466" y="464" text-anchor="middle" fill="#6F6A61" font-size="15">room floor &amp; walls</text>

  <!-- Store -->
  <rect x="368" y="524" width="196" height="64" rx="14" fill="#FFFFFF" stroke="#E0DBD0" stroke-width="2"/>
  <text x="466" y="552" text-anchor="middle" fill="#23201B" font-size="18" font-weight="600">SQLite + frames</text>
  <text x="466" y="574" text-anchor="middle" fill="#6F6A61" font-size="14">every reading, with its frame</text>

  <!-- Price -->
  <rect x="640" y="524" width="196" height="64" rx="14" fill="#FFFFFF" stroke="#E0DBD0" stroke-width="2"/>
  <text x="738" y="552" text-anchor="middle" fill="#23201B" font-size="18" font-weight="600">Price lookup</text>
  <text x="738" y="574" text-anchor="middle" fill="#6F6A61" font-size="14">sourced and dated</text>

  <!-- Packet -->
  <rect x="912" y="524" width="212" height="64" rx="14" fill="#23201B"/>
  <text x="1018" y="552" text-anchor="middle" fill="#EDE8DC" font-size="18" font-weight="600">Claim packet</text>
  <text x="1018" y="574" text-anchor="middle" fill="#A8A295" font-size="14">JSON + report + frames</text>

  <!-- Capture into the pipeline -->
  <path d="M272 104 H360" stroke="#8E887C" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M272 128 H312 V420 H360" stroke="#8E887C" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="322" y="372" fill="#6F6A61" font-size="14">depth + pose</text>

  <!-- The console reads what the sweep has recorded -->
  <path d="M368 556 H180 V310" stroke="#8E887C" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="196" y="430" fill="#6F6A61" font-size="14">inventory fills live,</text>
  <text x="196" y="450" fill="#6F6A61" font-size="14">packet downloads here</text>

  <!-- Admission -->
  <path d="M564 124 H632" stroke="#8E887C" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M836 124 H904" stroke="#8E887C" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="870" y="112" text-anchor="middle" fill="#6F6A61" font-size="14">admitted</text>

  <!-- Refusals -->
  <path d="M738 172 V230" stroke="#C3BBAC" stroke-width="2.5" fill="none" stroke-dasharray="7 6" marker-end="url(#arrow-dim)"/>
  <text x="754" y="208" fill="#8E887C" font-size="14">no book</text>
  <path d="M466 172 V270 H632" stroke="#C3BBAC" stroke-width="2.5" fill="none" stroke-dasharray="7 6" marker-end="url(#arrow-dim)"/>
  <text x="482" y="248" fill="#8E887C" font-size="14">blurred, dark</text>

  <!-- Readings go on to the remaining decisions, then to the packet -->
  <path d="M1018 172 V336 H882 V356" stroke="#8E887C" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M1018 476 V516" stroke="#8E887C" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M700 476 V500 H520 V516" stroke="#8E887C" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Measurement and pricing into the packet -->
  <path d="M442 476 V516" stroke="#8E887C" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M564 556 H632" stroke="#8E887C" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M836 556 H904" stroke="#8E887C" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="40" y="614" width="18" height="18" rx="5" fill="#2F5D3A"/>
  <text x="68" y="629" fill="#6F6A61" font-size="15">Drex decides</text>
  <rect x="212" y="614" width="18" height="18" rx="5" fill="#FFFFFF" stroke="#E0DBD0" stroke-width="2"/>
  <text x="240" y="629" fill="#6F6A61" font-size="15">everything else</text>
</svg>
