<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620" width="1280" height="620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Claims Assistant pipeline: Drex gates every frame before the vision model sees it</title>
  <rect width="1280" height="620" fill="#FAF7F0"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8E887C"/>
    </marker>
    <marker id="arrow-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#C3BBAC"/>
    </marker>
  </defs>

  <!-- Capture devices -->
  <rect x="40" y="56" width="240" height="96" rx="14" fill="#23201B"/>
  <text x="160" y="92" text-anchor="middle" fill="#EDE8DC" font-size="20" font-weight="600">Phone</text>
  <text x="160" y="118" text-anchor="middle" fill="#A8A295" font-size="15">camera · depth grid</text>
  <text x="160" y="138" text-anchor="middle" fill="#A8A295" font-size="15">· camera pose</text>

  <rect x="40" y="190" width="240" height="96" rx="14" fill="#23201B"/>
  <text x="160" y="226" text-anchor="middle" fill="#EDE8DC" font-size="20" font-weight="600">Laptop console</text>
  <text x="160" y="252" text-anchor="middle" fill="#A8A295" font-size="15">voice · notepad</text>
  <text x="160" y="272" text-anchor="middle" fill="#A8A295" font-size="15">· inventory · packet</text>

  <text x="160" y="320" text-anchor="middle" fill="#6F6A61" font-size="14">paired with a six-digit code</text>

  <!-- Local gate -->
  <rect x="356" y="76" width="196" height="96" rx="14" fill="#FFFFFF" stroke="#E0DBD0" stroke-width="2"/>
  <text x="454" y="112" text-anchor="middle" fill="#23201B" font-size="19" font-weight="600">Local gate</text>
  <text x="454" y="136" text-anchor="middle" fill="#6F6A61" font-size="15">sharpness · exposure</text>
  <text x="454" y="156" text-anchor="middle" fill="#8E887C" font-size="14" font-style="italic">free, instant</text>

  <!-- Drex admission -->
  <rect x="628" y="76" width="196" height="96" rx="14" fill="#2F5D3A"/>
  <text x="726" y="106" text-anchor="middle" fill="#FFFFFF" font-size="19" font-weight="600">Drex</text>
  <text x="726" y="130" text-anchor="middle" fill="#CFE4D6" font-size="15">book visible?</text>
  <text x="726" y="150" text-anchor="middle" fill="#CFE4D6" font-size="15">spine legible?</text>

  <!-- Vision model -->
  <rect x="900" y="76" width="212" height="96" rx="14" fill="#FFFFFF" stroke="#E0DBD0" stroke-width="2"/>
  <text x="1006" y="112" text-anchor="middle" fill="#23201B" font-size="19" font-weight="600">Vision model</text>
  <text x="1006" y="136" text-anchor="middle" fill="#6F6A61" font-size="15">spine text only</text>
  <text x="1006" y="156" text-anchor="middle" fill="#8E887C" font-size="14" font-style="italic">makes no decisions</text>

  <!-- Refused -->
  <rect x="628" y="236" width="196" height="64" rx="14" fill="#F3F0E8" stroke="#D8D1C2" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="726" y="264" text-anchor="middle" fill="#6F6A61" font-size="17" font-weight="600">Refused</text>
  <text x="726" y="286" text-anchor="middle" fill="#8E887C" font-size="14">no frontier call made</text>

  <!-- Drex decisions row -->
  <rect x="628" y="356" width="484" height="112" rx="14" fill="#2F5D3A"/>
  <text x="870" y="388" text-anchor="middle" fill="#FFFFFF" font-size="19" font-weight="600">Drex decides the rest</text>
  <text x="870" y="414" text-anchor="middle" fill="#CFE4D6" font-size="15">same book? · same object? · which catalogue work?</text>
  <text x="870" y="436" text-anchor="middle" fill="#CFE4D6" font-size="15">what did that correction mean? · what should the agent say?</text>
  <text x="870" y="458" text-anchor="middle" fill="#9DC4A9" font-size="14" font-style="italic">probabilities, not labels — the band between them is recorded as unresolved</text>

  <!-- Measurement -->
  <rect x="356" y="356" width="196" height="112" rx="14" fill="#FFFFFF" stroke="#E0DBD0" stroke-width="2"/>
  <text x="454" y="392" text-anchor="middle" fill="#23201B" font-size="19" font-weight="600">Depth → cm</text>
  <text x="454" y="416" text-anchor="middle" fill="#6F6A61" font-size="15">spine sizes</text>
  <text x="454" y="436" text-anchor="middle" fill="#6F6A61" font-size="15">object sizes</text>
  <text x="454" y="456" text-anchor="middle" fill="#6F6A61" font-size="15">room floor &amp; walls</text>

  <!-- Store -->
  <rect x="356" y="520" width="196" height="64" rx="14" fill="#FFFFFF" stroke="#E0DBD0" stroke-width="2"/>
  <text x="454" y="548" text-anchor="middle" fill="#23201B" font-size="18" font-weight="600">SQLite + frames</text>
  <text x="454" y="570" text-anchor="middle" fill="#6F6A61" font-size="14">every reading, with its frame</text>

  <!-- Price -->
  <rect x="628" y="520" width="196" height="64" rx="14" fill="#FFFFFF" stroke="#E0DBD0" stroke-width="2"/>
  <text x="726" y="548" text-anchor="middle" fill="#23201B" font-size="18" font-weight="600">Price lookup</text>
  <text x="726" y="570" text-anchor="middle" fill="#6F6A61" font-size="14">sourced and dated</text>

  <!-- Packet -->
  <rect x="900" y="520" width="212" height="64" rx="14" fill="#23201B"/>
  <text x="1006" y="548" text-anchor="middle" fill="#EDE8DC" font-size="18" font-weight="600">Claim packet</text>
  <text x="1006" y="570" text-anchor="middle" fill="#A8A295" font-size="14">JSON + report + frames</text>

  <!-- Flow arrows -->
  <path d="M280 104 H348" stroke="#8E887C" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M552 124 H620" stroke="#8E887C" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M824 124 H892" stroke="#8E887C" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="858" y="112" text-anchor="middle" fill="#6F6A61" font-size="14">admitted</text>

  <path d="M726 172 V228" stroke="#C3BBAC" stroke-width="2.5" fill="none" stroke-dasharray="7 6" marker-end="url(#arrow-dim)"/>
  <text x="742" y="206" fill="#8E887C" font-size="14">no book</text>

  <path d="M454 172 V228 H560" stroke="#C3BBAC" stroke-width="2.5" fill="none" stroke-dasharray="7 6"/>
  <path d="M560 228 H620" stroke="#C3BBAC" stroke-width="2.5" fill="none" stroke-dasharray="7 6" marker-end="url(#arrow-dim)"/>
  <text x="470" y="206" fill="#8E887C" font-size="14">blurred, dark</text>

  <path d="M1006 172 V330 H870 V348" stroke="#8E887C" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <path d="M280 104 V412 H348" stroke="#8E887C" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="296" y="400" fill="#6F6A61" font-size="14">depth + pose</text>

  <path d="M628 412 H560" stroke="#8E887C" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M454 468 V512" stroke="#8E887C" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M552 552 H620" stroke="#8E887C" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M824 552 H892" stroke="#8E887C" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <path d="M1006 468 V512" stroke="#8E887C" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="40" y="520" width="18" height="18" rx="5" fill="#2F5D3A"/>
  <text x="68" y="535" fill="#6F6A61" font-size="15">Drex decides</text>
  <rect x="40" y="552" width="18" height="18" rx="5" fill="#FFFFFF" stroke="#E0DBD0" stroke-width="2"/>
  <text x="68" y="567" fill="#6F6A61" font-size="15">everything else</text>
</svg>
